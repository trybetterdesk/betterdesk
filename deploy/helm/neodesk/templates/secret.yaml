{{- if not .Values.secrets.existingSecret }}
{{- $name := include "neodesk.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "neodesk.labels" . | nindent 4 }}
  annotations:
    # The random values stay when the release is removed, so a new install
    # on the same data keeps working
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "API_KEY" "SESSION_SECRET" "JWT_SECRET" "REMOTE_TARGET_VAULT_KEY" "NEODESK_CLUSTER_SECRET" }}
  {{ $key }}: {{ get $old $key | default (randAlphaNum 48 | b64enc) }}
  {{- end }}
  {{- with .Values.postgresql.url }}
  DATABASE_URL: {{ . | b64enc }}
  {{- end }}
  {{- with include "neodesk.valkeyURL" . }}
  VALKEY_URL: {{ . | b64enc }}
  {{- end }}
{{- end }}
