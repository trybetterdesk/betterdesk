apiVersion: apps/v1
kind: Deployment
metadata:
  name: neodesk
  labels:
    app.kubernetes.io/name: neodesk
    app.kubernetes.io/instance: neodesk
    app.kubernetes.io/version: "3.6.0-rc.6"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: neodesk-0.1.0
    app.kubernetes.io/component: server
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: neodesk
      app.kubernetes.io/instance: neodesk
      app.kubernetes.io/component: server
  strategy:
    # One new pod at a time, and never fewer ready pods than wanted: the new
    # pod migrates the database under the installation lock while the old
    # ones keep serving
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neodesk
        app.kubernetes.io/instance: neodesk
        app.kubernetes.io/component: server
      annotations:
    spec:
      terminationGracePeriodSeconds: 50
      containers:
        - name: neodesk
          image: "ghcr.io/neodeskapp/neodesk:latest"
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RELAY_SERVERS
              value: "neodesk.example.com"
            - name: NEODESK_KEY_PREFIX
              value: "neodesk:"
            - name: NEODESK_SHUTDOWN_GRACE
              value: "30s"
            - name: NEODESK_UPDATE_MODE
              value: image
          envFrom:
            - secretRef:
                name: neodesk-secrets
          ports:
            - { name: console, containerPort: 3375, protocol: TCP }
            - { name: api, containerPort: 21121, protocol: TCP }
            - { name: client-api, containerPort: 21114, protocol: TCP }
            - { name: nat-test, containerPort: 21115, protocol: TCP }
            - { name: signal, containerPort: 21116, protocol: TCP }
            - { name: signal-udp, containerPort: 21116, protocol: UDP }
            - { name: relay, containerPort: 21117, protocol: TCP }
            - { name: signal-ws, containerPort: 21118, protocol: TCP }
            - { name: relay-ws, containerPort: 21119, protocol: TCP }
            - { name: cdap, containerPort: 21122, protocol: TCP }
            # Pod-to-pod calls of the installation, signed with
            # NEODESK_CLUSTER_SECRET; not published
            - { name: cluster, containerPort: 21124, protocol: TCP }
          startupProbe:
            httpGet: { path: /api/health, port: api }
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            # 503 while the pod drains or Valkey does not answer
            httpGet: { path: /api/health, port: api }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            # The process, not its dependencies: a Valkey outage must not
            # restart every pod
            tcpSocket: { port: signal }
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              # The Service drops the pod before it stops listening
              exec:
                command: ["sleep", "5"]
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /opt/neodesk/data
              subPath: server
            - name: data
              mountPath: /app/data
              subPath: console
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: neodesk-data
      affinity:
        # Replicas on different nodes where possible
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: neodesk
                    app.kubernetes.io/instance: neodesk
                    app.kubernetes.io/component: server
